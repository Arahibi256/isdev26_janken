<!DOCTYPE html>
<html>

<head>
  <title>Janken Game</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>

  <h1>Janken GAME!!</h1>

  <h3>Hi <span sec:authentication="name"></span></h3>

  <div th:if="${entry}">
    <h2>エントリー</h2>
    <ul>
      <li th:each="user: ${entry}"><a th:href="@{/match(opponentId=${user.id})}">[[${user.name}]]</a></li>
    </ul>
  </div>

  <div th:if="${matches}">
    <h2>試合結果</h2>
    <p th:each="match: ${matches}">id: [[${match.id}]], user1: [[${match.user1}]], user2: [[${match.user2}]],
      user1の手: [[${match.user1Hand}]], user2の手: [[${match.user2Hand}]]</p>
  </div>
</body>

</html>
