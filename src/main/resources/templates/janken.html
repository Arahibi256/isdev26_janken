<!DOCTYPE html>
<html>

<head>
  <title>Janken Game</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>

  <h1>Janken GAME!!</h1>

  <h3>Hi <span sec:authentication="name"></span></h3>

  <div th:if="${entry}">
    <p>エントリー</p>
    <ul>
      <li th:each="user: ${entry}">[[${user.name}]]</li>
    </ul>
  </div>

  <div th:if="${result}">
    <p>あなたの手: [[${playerHand}]]</p>
    <p>相手の手: [[${computerHand}]]</p>
    <p>結果: [[${result}]]</p>
  </div>
</body>

</html>
