<!DOCTYPE html>
<html>

<head>
  <title>Janken Game</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>

  <h1>Janken GAME!!</h1>

  <dev th:if="${entry}">
    <p>エントリー</p>
    <ul>
      <li th:each="user : ${entry.users}">[[${user}]]</li>
    </ul>
  </dev>

  <dev th:if="${playerName}">
    <p>Hi [[${playerName}]]</p>
  </dev>

  <a href="/janken/play?hand=ROCK">グー</a>
  <a href="/janken/play?hand=SCISSORS">チョキ</a>
  <a href="/janken/play?hand=PAPER">パー</a>

  <div th:if="${result}">
    <p>あなたの手: [[${playerHand}]]</p>
    <p>相手の手: [[${computerHand}]]</p>
    <p>結果: [[${result}]]</p>
  </div>
</body>

</html>
